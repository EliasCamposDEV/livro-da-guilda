de:
  flapdoodle:
    mongodb:
      embedded:
        version: ${EMBEDDED_MONGO_VERSION:8.0.5}

# Os testes usam um notifier de captura quando precisam ler o token.
app:
  security:
    jwt:
      secret: test-secret-with-at-least-32-characters-0123
    password-reset:
      delivery: log

logging:
  level:
    root: WARN
    com.eliascampos: INFO
    de.flapdoodle: WARN
