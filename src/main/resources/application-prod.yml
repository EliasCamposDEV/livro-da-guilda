# Em producao o MongoDB embarcado fica desativado e a conexao usa MONGODB_URI.
spring:
  autoconfigure:
    exclude: de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
  mongodb:
    # Sem valor padrao: a aplicacao falha ao subir se MONGODB_URI nao existir.
    uri: ${MONGODB_URI}
  data:
    mongodb:
      # Indices continuam sendo criados na subida para garantir o e-mail unico.
      # Com varias instancias ou zero-downtime, mova isso para um passo de deploy.
      auto-index-creation: true

# Atras de proxy reverso: respeita X-Forwarded-For/Proto (IP real no rate limit do login).
server:
  forward-headers-strategy: native

# Nao expor detalhes de infraestrutura no health check publico.
management:
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      # Sem valor padrao: a aplicacao falha ao subir se JWT_SECRET nao existir.
      secret: ${JWT_SECRET}
    password-reset:
      # Ate existir um provedor de e-mail, o endpoint responde 503 e nao cria token.
      delivery: none
