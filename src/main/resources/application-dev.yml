# Em dev, um MongoDB embarcado e efemero e iniciado automaticamente.
# Para usar um MongoDB real, rode com SPRING_PROFILES_ACTIVE=prod e MONGODB_URI.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: ${EMBEDDED_MONGO_VERSION:8.0.5}

# Em dev o token de redefinicao aparece no log (marcador PASSWORD_RESET_TOKEN).
app:
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@email.com}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    password-reset:
      delivery: log
