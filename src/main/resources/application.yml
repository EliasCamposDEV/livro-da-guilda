spring:
  application:
    name: livro-da-guilda
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/usuarios}
  data:
    mongodb:
      # Indices sao criados pela migracao versionada (IndexMigration).
      auto-index-creation: false
  jackson:
    default-property-inclusion: non_null
  data.web.pageable:
    max-page-size: 50

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    document-title: Livro da Guilda - API
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    default-models-expand-depth: -1
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  health:
    # O starter do Redis cria um connection factory padrao para localhost:6379.
    # Sem Redis configurado, esse health ficaria DOWN e derrubaria o deploy.
    redis:
      enabled: ${APP_RATE_LIMIT_REDIS_ENABLED:false}
    mongodb:
      # O health padrao do Boot 4 roda `hello` em TODOS os bancos, inclusive
      # `local`. O usuario do Atlas tem privilegio minimo e nao pode ler `local`,
      # o que derrubava o health check do Render. O indicador da aplicacao
      # (ApplicationDatabaseHealthIndicator) faz ping apenas no banco usado pela API.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  level:
    org.mongodb.driver: WARN

app:
  # Origens separadas por virgula liberadas para o navegador. Vazio desliga o CORS.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Cria o primeiro ADMIN em banco vazio fora de dev/test; sem as variaveis nao faz nada.
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      # Minimo de 32 caracteres (HS256). Em producao, defina JWT_SECRET.
      secret: ${JWT_SECRET}
      issuer: livro-da-guilda
      ttl-seconds: 3600
      # 7 dias: vida do refresh token usado em /auth/refresh.
      refresh-ttl-seconds: 604800
    password-reset:
      # log apenas em dev/test; none responde 503 e evita gerar token sem entrega.
      delivery: ${PASSWORD_RESET_DELIVERY:none}
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT15M}
    single-session: ${APP_SINGLE_SESSION:true}
  rate-limit:
    # Padrao local. Com mais de uma instancia, habilite e aponte para um Redis compartilhado.
    redis-enabled: ${APP_RATE_LIMIT_REDIS_ENABLED:false}
    redis-uri: ${APP_RATE_LIMIT_REDIS_URI:}
